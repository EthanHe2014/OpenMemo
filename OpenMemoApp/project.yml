name: OpenMemoApp
options:
  bundleIdPrefix: com.openmemo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "W44ZFDH6DG"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
targets:
  OpenMemoApp:
    type: application
    platform: iOS
    sources:
      - path: OpenMemoApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: OpenMemoApp
        PRODUCT_BUNDLE_IDENTIFIER: com.openmemo.app
        PRODUCT_MODULE_NAME: OpenMemoApp
        INFOPLIST_FILE: OpenMemoApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 11
schemes:
  OpenMemoApp:
    build:
      targets:
        OpenMemoApp: all
    run:
      config: Debug